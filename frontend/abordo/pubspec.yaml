name: abordo
description: ABORDO - cobro de pasaje con CoDi para pasajeros, choferes y dueños de unidades.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  intl: ">=0.19.0 <1.0.0"
  flutter_tts: ^4.2.0
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8
  pdf: ^3.11.1
  printing: ^5.13.1
  table_calendar: ^3.1.2
  skeletonizer: ">=1.4.0 <3.0.0"
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10
  maplibre_gl: ^0.26.2
  geolocator: ^14.0.2
  animated_background: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/PhosphorBold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/PhosphorFill.ttf
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/PhosphorRegular.ttf
  assets:
    - assets/clouds/
    - assets/mascot/
    - assets/bus/
    - assets/trees/